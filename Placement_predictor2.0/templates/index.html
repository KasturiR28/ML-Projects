<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Placement Predictor</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <i class="fas fa-user-graduate logo"></i>
        <h1>AI Placement Predictor</h1>
        <p>Machine Learning Based Placement Prediction System</p>
    </div>

    <form action="/predict" method="POST">

        <div class="grid">

            <div class="input-box">
                <i class="fas fa-chart-line"></i>
                <input type="number" step="0.01"
                       name="CGPA"
                       placeholder="CGPA"
                       required>
            </div>

            <div class="input-box">
                <i class="fas fa-briefcase"></i>
                <input type="number"
                       name="Internships"
                       placeholder="Internships"
                       required>
            </div>

            <div class="input-box">
                <i class="fas fa-folder-open"></i>
                <input type="number"
                       name="Projects"
                       placeholder="Projects"
                       required>
            </div>

            <div class="input-box">
                <i class="fas fa-certificate"></i>
                <input type="number"
                       name="WorkshopsCertifications"
                       placeholder="Workshops & Certifications"
                       required>
            </div>

            <div class="input-box">
                <i class="fas fa-brain"></i>
                <input type="number"
                       step="0.01"
                       name="AptitudeTestScore"
                       placeholder="Aptitude Test Score"
                       required>
            </div>

            <div class="input-box">
                <i class="fas fa-comments"></i>
                <input type="number"
                       step="0.01"
                       name="SoftSkillsRating"
                       placeholder="Soft Skills Rating"
                       required>
            </div>

            <div class="input-box">
                <i class="fas fa-school"></i>
                <input type="number"
                       step="0.01"
                       name="SSC_Marks"
                       placeholder="SSC Marks (%)"
                       required>
            </div>

            <div class="input-box">
                <i class="fas fa-book-open"></i>
                <input type="number"
                       step="0.01"
                       name="HSC_Marks"
                       placeholder="HSC Marks (%)"
                       required>
            </div>

            <div class="input-box">
                <i class="fas fa-futbol"></i>
                <select name="ExtracurricularActivities" required>
                    <option value="">Extracurricular Activities</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div class="input-box">
                <i class="fas fa-chalkboard-teacher"></i>
                <select name="PlacementTraining" required>
                    <option value="">Placement Training</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

        </div>

        <button type="submit" class="predict-btn">
            <i class="fas fa-rocket"></i>
            Predict Placement
        </button>

    </form>

    {% if prediction_text %}
    <div class="result-card {{status}}">
        {{ prediction_text }}
    </div>
    {% endif %}

</div>

</body>
</html>
